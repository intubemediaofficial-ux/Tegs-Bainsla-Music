<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #14141c;
        color: #e2e8f0;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2a2a3a;
        background: #0a0a0f;
        color: #e2e8f0;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #7c3aed;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .ok {
        color: #4ade80;
        font-size: 13px;
        margin-left: 10px;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h1>Bainsla Tags — Settings</h1>
    <p>Connect the extension to your dashboard account.</p>
    <label>Dashboard URL</label>
    <input id="apiBase" placeholder="https://your-dashboard.vercel.app" />
    <label>API key (from dashboard → Settings)</label>
    <input id="apiKey" placeholder="bmt_…" />
    <div>
      <button id="save">Save</button>
      <span id="ok" class="ok"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
