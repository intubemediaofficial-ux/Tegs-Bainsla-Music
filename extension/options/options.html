<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #14141c;
        color: #e2e8f0;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .box {
        margin: 18px 0;
        padding: 14px;
        border: 1px solid #2a2a3a;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.22), rgba(6, 182, 212, 0.1));
      }
      .who {
        font-size: 14px;
        font-weight: 600;
      }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, #7c3aed, #ec4899);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: none;
        border: 1px solid #2a2a3a;
        color: #cbd5e1;
        margin-left: 8px;
      }
      summary {
        font-size: 12px;
        color: #94a3b8;
        cursor: pointer;
        margin-top: 24px;
      }
      input {
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2a2a3a;
        background: #0a0a0f;
        color: #e2e8f0;
      }
      .ok {
        color: #4ade80;
        font-size: 13px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Bainsla Tags — Settings</h1>

    <div class="box">
      <div id="who" class="who">Not connected</div>
      <p id="detail">Sign in once and the extension connects itself — no API key to copy.</p>
      <button id="connect">Sign in / Connect</button>
      <button id="disconnect" class="ghost" hidden>Sign out</button>
    </div>

    <details>
      <summary>Advanced — self-hosted dashboard</summary>
      <p>Only change this if you run your own copy of the dashboard.</p>
      <input id="apiBase" placeholder="https://tag.bainslamusic.com" />
      <button id="save">Save</button>
      <span id="ok" class="ok"></span>
    </details>

    <script src="options.js"></script>
  </body>
</html>
